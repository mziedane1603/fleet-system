<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة سيارات التوزيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f8a72;
  --primary-dark:#0b6e5c;
  --primary-light:#e4f5f1;
  --gold:#f2b73b;
  --blue:#3b8bd4;
  --orange:#f0883e;
  --purple:#8b6bd4;
  --bg:#f3f6f5;
  --card:#ffffff;
  --text:#1f2b29;
  --muted:#6b7b78;
  --border:#e5ecea;
  --danger:#e0524f;
  --warn:#e0a020;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
button,input,select,textarea{font-family:'Cairo',sans-serif;}
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:#fff;border-left:1px solid var(--border);padding:16px 12px;flex-shrink:0;}
.mobile-topbar{display:none;}
.sidebar-overlay{display:none;}
.mobile-close{display:none;}
@media (max-width:820px){
  .app{position:relative;overflow-x:hidden;flex-direction:column;}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--border);padding:12px 14px;position:sticky;top:0;z-index:30;}
  .mobile-topbar .brand{border-bottom:none;padding:0;margin:0;}
  .hamburger-btn{background:var(--primary-light);border:none;color:var(--primary-dark);font-size:18px;width:38px;height:38px;border-radius:9px;cursor:pointer;flex-shrink:0;}
  .sidebar{position:fixed;top:0;right:0;height:100vh;z-index:60;transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow-y:auto;width:78vw;max-width:280px;}
  .sidebar.open{transform:translateX(0);}
  .mobile-close{display:block;background:transparent;border:none;font-size:18px;color:var(--muted);cursor:pointer;margin-right:auto;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,25,23,.35);z-index:55;}
  .sidebar-overlay.open{display:block;}
  .main{padding:14px;}
  .topbar{flex-direction:column;align-items:stretch;}
  .actions{width:100%;}
  .actions .btn{flex:1;justify-content:center;}
  .cards-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-value{font-size:18px;}
  .form-grid{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .bar-chart{height:150px;}
  table{min-width:520px;}
  .welcome h1{font-size:16.5px;}
}
@media (max-width:420px){
  .cards-grid{grid-template-columns:1fr 1fr;}
}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand-icon{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand-text{font-weight:800;font-size:14px;color:var(--primary-dark);line-height:1.3;}
.nav-group-label{font-size:11px;color:var(--muted);font-weight:700;margin:14px 8px 6px;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:#43524f;text-align:right;margin-bottom:2px;position:relative;}
.nav-btn:hover{background:#f2f7f6;}
.nav-btn.active{background:var(--primary-light);color:var(--primary-dark);}
.nav-icon{font-size:15px;width:18px;text-align:center;}
.nav-badge{margin-right:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}
.main{flex:1;padding:22px 26px;min-width:0;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.welcome h1{font-size:19px;margin:0 0 4px;color:var(--primary-dark);}
.welcome p{margin:0;color:var(--muted);font-size:12.5px;}
.actions{display:flex;gap:8px;}
.btn{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary-dark);}
.btn-danger{background:#fdeceb;color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat-label{font-size:12px;color:var(--muted);font-weight:700;}
.stat-value{font-size:22px;font-weight:800;color:var(--text);}
.stat-sub{font-size:11px;color:var(--muted);}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
.panel-title{font-size:15px;font-weight:800;color:var(--primary-dark);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar{width:60%;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px;transition:height .3s;}
.bar-label{font-size:11px;color:var(--muted);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-val{font-size:11px;font-weight:700;color:var(--text);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fbfdfc;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.form-actions{margin-top:16px;display:flex;gap:8px;}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px;}
thead th{background:var(--primary);color:#fff;padding:10px 8px;text-align:center;font-weight:700;white-space:nowrap;}
tbody td{padding:8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover{background:#f7fbfa;}
tbody tr:last-child td{border-bottom:none;}
.empty-row td{padding:26px;color:var(--muted);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-warn{background:#fdf3dc;color:#a97a0a;}
.pill-danger{background:#fdeceb;color:var(--danger);}
.pill-ok{background:var(--primary-light);color:var(--primary-dark);}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar select,.toolbar input{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;background:#fbfdfc;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:800px){.two-col{grid-template-columns:1fr;}}
.alert-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;}
.alert-item.danger{background:#fdf3f2;border-color:#f6d3d1;}
.alert-item.warn{background:#fdf8ea;border-color:#f3e3ae;}
.alert-icon{font-size:18px;}
.alert-title{font-weight:700;font-size:13px;}
.alert-sub{font-size:11.5px;color:var(--muted);}
.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:slideIn .2s ease;}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.mini-list{display:flex;flex-direction:column;gap:8px;}
.mini-row{display:flex;align-items:center;justify-content:space-between;background:#fbfdfc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;}
.section-desc{font-size:12px;color:var(--muted);margin:-8px 0 14px;}
.icon-btn{background:transparent;border:none;cursor:pointer;font-size:14px;padding:4px;border-radius:6px;}
.icon-btn:hover{background:#f0f4f3;}
.badge-count{background:var(--primary-light);color:var(--primary-dark);font-weight:700;font-size:11px;padding:2px 9px;border-radius:20px;}
.file-note{font-size:11px;color:var(--muted);margin-top:6px;}
.thumb{width:36px;height:36px;border-radius:7px;object-fit:cover;}
.loading{padding:60px;text-align:center;color:var(--muted);}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
.chk{display:flex;align-items:center;gap:6px;}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="loading" style="width:100%">جارِ تحميل النظام...</div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

/* ---------------- Firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAlgja4VrazMhzarfXZ2-XipPK6k5vXc0I",
  authDomain: "fleetsystem-415e0.firebaseapp.com",
  projectId: "fleetsystem-415e0",
  storageBucket: "fleetsystem-415e0.firebasestorage.app",
  messagingSenderId: "903276791732",
  appId: "1:903276791732:web:f82755f9dd784ec0a494e1",
  measurementId: "G-FZX5EMYZQD"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const FS_COLLECTION = 'fleetSystem';

/* ---------------- State ---------------- */
let DEFS = { vehicles: [], drivers: [], lines: [], expenseTypes: [], users: [] };
let MOV = { dailyLogs: [], expenses: [] };
let SETTINGS = { oilChangeThreshold: 5000, licenseAlertDays: 30 };
let currentView = 'dashboard';
let currentUser = null;
let storageReady = true;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtNum = n => Number(n||0).toLocaleString('en-US');
const fmtMoney = n => Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ---------------- Storage (Firebase Firestore) ---------------- */
let dbError = null; // holds last connection/permission error message, if any
async function loadState(){
  try{
    const d = await getDoc(doc(db, FS_COLLECTION, 'definitions'));
    if(d.exists()) DEFS = { vehicles:[], drivers:[], lines:[], expenseTypes:[], users:[], ...d.data() };
  }catch(e){ console.error(e); dbError = e.message || String(e); }
  try{
    const m = await getDoc(doc(db, FS_COLLECTION, 'movements'));
    if(m.exists()) MOV = { dailyLogs:[], expenses:[], ...m.data() };
  }catch(e){ console.error(e); dbError = e.message || String(e); }
  try{
    const s = await getDoc(doc(db, FS_COLLECTION, 'settings'));
    if(s.exists()) SETTINGS = { oilChangeThreshold:5000, licenseAlertDays:30, ...s.data() };
  }catch(e){ console.error(e); dbError = e.message || String(e); }
}
async function saveDefs(){
  try{ await setDoc(doc(db, FS_COLLECTION, 'definitions'), JSON.parse(JSON.stringify(DEFS))); dbError = null; return true; }
  catch(e){ console.error(e); storageReady=false; dbError = e.message || String(e); toast('تعذر حفظ البيانات على Firebase — راجع صلاحيات Firestore'); return false; }
}
async function saveMov(){
  try{ await setDoc(doc(db, FS_COLLECTION, 'movements'), JSON.parse(JSON.stringify(MOV))); dbError = null; return true; }
  catch(e){ console.error(e); storageReady=false; dbError = e.message || String(e); toast('تعذر حفظ البيانات على Firebase — راجع صلاحيات Firestore'); return false; }
}
async function saveSettings(){
  try{ await setDoc(doc(db, FS_COLLECTION, 'settings'), JSON.parse(JSON.stringify(SETTINGS))); dbError = null; return true; }
  catch(e){ console.error(e); storageReady=false; dbError = e.message || String(e); toast('تعذر حفظ الإعدادات على Firebase'); return false; }
}

/* ---------------- Derived helpers ---------------- */
function vehicleById(id){ return DEFS.vehicles.find(v=>v.id===id); }
function lineById(id){ return DEFS.lines.find(l=>l.id===id); }
function driverById(id){ return DEFS.drivers.find(d=>d.id===id); }
function expTypeById(id){ return DEFS.expenseTypes.find(e=>e.id===id); }

function vehicleLogsSorted(vehicleId){
  return MOV.dailyLogs.filter(l=>l.vehicleId===vehicleId).sort((a,b)=>a.date.localeCompare(b.date)||a._seq-b._seq);
}
function computeCumulativeKm(vehicleId, uptoEntryId){
  const logs = vehicleLogsSorted(vehicleId);
  let cum = 0;
  for(const l of logs){
    cum += Number(l.distance)||0;
    if(l.id===uptoEntryId) return cum;
    if(l.oilChanged) cum = 0;
  }
  return cum;
}
function lastOdometer(vehicleId, beforeDate){
  const logs = vehicleLogsSorted(vehicleId).filter(l=> l.date <= beforeDate);
  if(!logs.length) return 0;
  return Number(logs[logs.length-1].odometerToday)||0;
}

function licenseAlerts(){
  const out = [];
  const today = new Date();
  DEFS.vehicles.forEach(v=>{
    if(!v.licenseDate) return;
    const d = new Date(v.licenseDate);
    const diffDays = Math.ceil((d - today)/86400000);
    if(diffDays < 0){
      out.push({level:'danger', title:`رخصة السيارة "${v.name||v.plateNumber}" منتهية`, sub:`انتهت في ${v.licenseDate}`});
    } else if(diffDays <= SETTINGS.licenseAlertDays){
      out.push({level:'warn', title:`رخصة السيارة "${v.name||v.plateNumber}" قاربت على الانتهاء`, sub:`تنتهي خلال ${diffDays} يوم (${v.licenseDate})`});
    }
  });
  return out;
}
function oilAlerts(){
  const out = [];
  DEFS.vehicles.forEach(v=>{
    const logs = vehicleLogsSorted(v.id);
    if(!logs.length) return;
    const last = logs[logs.length-1];
    const cum = computeCumulativeKm(v.id, last.id);
    if(cum >= SETTINGS.oilChangeThreshold){
      out.push({level:'danger', title:`السيارة "${v.name||v.plateNumber}" تحتاج تغيير زيت`, sub:`قطعت ${fmtNum(cum)} كم منذ آخر تغيير`});
    } else if(cum >= SETTINGS.oilChangeThreshold*0.8){
      out.push({level:'warn', title:`السيارة "${v.name||v.plateNumber}" تقترب من موعد تغيير الزيت`, sub:`قطعت ${fmtNum(cum)} كم من ${fmtNum(SETTINGS.oilChangeThreshold)} كم`});
    }
  });
  return out;
}
function allAlerts(){ return [...licenseAlerts(), ...oilAlerts()]; }

/* ---------------- Nav ---------------- */
const NAV = [
  {group:'', items:[{id:'dashboard', label:'الرئيسية', icon:'🏠'}]},
  {group:'التعريفات', items:[
    {id:'vehicles', label:'السيارات', icon:'🚗'},
    {id:'drivers-lines', label:'السائقين وخطوط التوزيع', icon:'🧭'},
    {id:'expense-types', label:'أنواع المصروفات', icon:'🏷️'},
  ]},
  {group:'الحركة اليومية', items:[
    {id:'daily-log', label:'القراءات اليومية', icon:'📋'},
    {id:'expenses', label:'المصروفات', icon:'💰'},
  ]},
  {group:'النظام', items:[
    {id:'reports', label:'التقارير', icon:'📊'},
    {id:'alerts', label:'التنبيهات', icon:'🔔', badge:true},
    {id:'import-export', label:'استيراد وتصدير', icon:'📥'},
    {id:'backup', label:'النسخ الاحتياطي', icon:'💾'},
  ]},
  {group:'الإدارة', items:[
    {id:'users-manage', label:'المستخدمون والصلاحيات', icon:'👥', adminOnly:true},
  ]},
];
const ALL_VIEW_IDS = NAV.flatMap(g=>g.items).map(it=>it.id);

function canAccess(viewId){
  if(!currentUser) return false;
  if(viewId==='dashboard' || viewId==='change-password') return true;
  if(currentUser.isAdmin) return true;
  if(viewId==='users-manage') return false;
  return (currentUser.permissions||[]).includes(viewId);
}

function renderApp(){
  const app = document.getElementById('app');
  if(!currentUser){ renderLogin(app); return; }
  const alertsCount = allAlerts().length;
  const currentLabel = NAV.flatMap(g=>g.items).find(it=>it.id===currentView)?.label || '';
  app.innerHTML = `
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn">☰</button>
      <div class="brand"><div class="brand-icon">🚚</div><div class="brand-text">${currentLabel||'متابعة سيارات التوزيع'}</div></div>
      <div style="width:38px"></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebarEl">
      <div class="brand">
        <div class="brand-icon">🚚</div>
        <div class="brand-text">متابعة سيارات<br>التوزيع</div>
        <button class="mobile-close" id="sidebarCloseBtn">✕</button>
      </div>
      ${NAV.map(g=>{
        const visibleItems = g.items.filter(it => !(it.adminOnly && !currentUser.isAdmin) && canAccess(it.id));
        if(!visibleItems.length) return '';
        return `
        ${g.group?`<div class="nav-group-label">${g.group}</div>`:''}
        ${visibleItems.map(it=>`
          <button class="nav-btn ${currentView===it.id?'active':''}" data-nav="${it.id}">
            <span class="nav-icon">${it.icon}</span>
            <span>${it.label}</span>
            ${it.badge && alertsCount>0 ? `<span class="nav-badge">${alertsCount}</span>`:''}
          </button>
        `).join('')}`;
      }).join('')}
      <hr class="sep">
      <div class="mini-row" style="margin-bottom:8px">
        <span>👤 ${esc(currentUser.username)}${currentUser.isAdmin?' (مدير)':''}</span>
      </div>
      <button class="nav-btn" data-nav="change-password"><span class="nav-icon">🔑</span><span>تغيير كلمة المرور</span></button>
      <button class="nav-btn" id="logoutBtn"><span class="nav-icon">🚪</span><span>تسجيل خروج</span></button>
    </aside>
    <main class="main" id="mainContent"></main>
  `;
  const sidebarEl = document.getElementById('sidebarEl');
  const overlayEl = document.getElementById('sidebarOverlay');
  const openSidebar = ()=>{ sidebarEl.classList.add('open'); overlayEl.classList.add('open'); };
  const closeSidebar = ()=>{ sidebarEl.classList.remove('open'); overlayEl.classList.remove('open'); };
  document.getElementById('hamburgerBtn')?.addEventListener('click', openSidebar);
  document.getElementById('sidebarCloseBtn')?.addEventListener('click', closeSidebar);
  overlayEl.addEventListener('click', closeSidebar);
  app.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>{ currentView = b.dataset.nav; closeSidebar(); renderApp(); });
  });
  document.getElementById('logoutBtn')?.addEventListener('click', ()=>{
    currentUser = null; currentView = 'dashboard'; renderApp();
  });
  renderView();
}

function renderView(){
  const main = document.getElementById('mainContent');
  if(!canAccess(currentView)){
    main.innerHTML = `<div class="panel"><div class="panel-title">🚫 غير مصرح لك بالوصول</div><p class="section-desc">ليس لديك صلاحية عرض هذه الصفحة. تواصل مع مدير النظام لطلب الصلاحية.</p></div>`;
    return;
  }
  const renderers = {
    'dashboard': renderDashboard,
    'vehicles': renderVehicles,
    'drivers-lines': renderDriversLines,
    'expense-types': renderExpenseTypes,
    'daily-log': renderDailyLog,
    'expenses': renderExpenses,
    'reports': renderReports,
    'alerts': renderAlerts,
    'import-export': renderImportExport,
    'backup': renderBackup,
    'users-manage': renderUsersManage,
    'change-password': renderChangePassword,
  };
  (renderers[currentView] || renderDashboard)(main);
}

/* ---------------- Login ---------------- */
function renderLogin(app){
  app.innerHTML = `
    <div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="max-width:380px;width:100%;">
        ${dbError ? `
        <div class="alert-item danger" style="margin-bottom:14px;align-items:flex-start;">
          <span class="alert-icon">⛔</span>
          <div>
            <div class="alert-title">تعذر الاتصال بقاعدة البيانات (Firebase)</div>

function nextCode(kind){
  const arr = DEFS[kind]||[];
  return String(arr.length+1);
}
function fileToThumb(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size=120;
        const canvas=document.createElement('canvas');
        canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Import / Export ---------------- */
function toCSV(arr){
  if(!arr.length) return '';
  const headers = Object.keys(arr[0]);
  const lines = [headers.join(',')];
  arr.forEach(row=>{
    lines.push(headers.map(h=>{
      let v = row[h]==null?'':String(row[h]);
      if(v.includes(',')||v.includes('"')||v.includes('\n')) v = '"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(','));
  });
  return '\uFEFF'+lines.join('\n');
}
function parseCSV(text){
  const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',');
    const obj = {};
    headers.forEach((h,i)=>obj[h]=(cells[i]||'').trim());
    return obj;
  });
}
function downloadFile(filename, content, mime='text/csv;charset=utf-8'){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    let data, name;
    if(kind==='vehicles'){ data = DEFS.vehicles.map(v=>({code:v.code,name:v.name,plateNumber:v.plateNumber,vType:v.vType,model:v.model,color:v.color,licenseDate:v.licenseDate})); name='السيارات.csv'; }
    if(kind==='dailyLogs'){ data = MOV.dailyLogs.map(l=>({date:l.date, vehicle:vehicleById(l.vehicleId)?.name||'', odometerYesterday:l.odometerYesterday, odometerToday:l.odometerToday, distance:l.distance, oilChanged:l.oilChanged?'نعم':'لا', notes:l.notes})); name='القراءات_اليومية.csv'; }
    if(kind==='expenses'){ data = MOV.expenses.map(x=>({date:x.date, vehicle:vehicleById(x.vehicleId)?.name||'', type:expTypeById(x.expenseTypeId)?.name||'', amount:x.amount, notes:x.notes})); name='المصروفات.csv'; }
    if(!data.length){ toast('لا توجد بيانات للتصدير'); return; }
    downloadFile(name, toCSV(data));
  }));
  document.getElementById('importBtn').addEventListener('click', async ()=>{
    const file = document.getElementById('importFile').files[0];
    if(!file){ toast('اختر ملف CSV أولاً'); return; }
    const text = await file.text();
    const rows = parseCSV(text);
    let count = 0;
    rows.forEach(r=>{
      if(!r.name && !r.plateNumber) return;
      DEFS.vehicles.push({
        id: uid(), code: r.code||nextCode('vehicles'), name: r.name||'', plateNumber: r.plateNumber||'',
        vType: r.vType||'', model: r.model||'', color: r.color||'', licenseDate: r.licenseDate||'',
        lineId:null, driverId:null, assignDate:'', distributorName:'', photo:null
      });
      count++;
    });
    await saveDefs();
    document.getElementById('importResult').textContent = `تم استيراد ${count} سيارة بنجاح`;
    toast('تم الاستيراد');
  });
}

/* ---------------- Backup ---------------- */
function renderBackup(main){
  main.innerHTML = `
    <div class="topbar"><div class="welcome"><h1>💾 النسخ الاحتياطي</h1><p>حفظ نسخة كاملة من بيانات النظام أو استرجاعها</p></div></div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-title">تصدير نسخة احتياطية</div>
        <p class="section-desc">يتم تصدير جميع التعريفات والحركة اليومية والإعدادات في ملف واحد.</p>
        <button class="btn btn-primary" id="backupExportBtn">تنزيل نسخة احتياطية (JSON)</button>
      </div>
      <div class="panel">
        <div class="panel-title">استرجاع نسخة احتياطية</div>
        <p class="section-desc">سيتم استبدال البيانات الحالية بالكامل بالبيانات الموجودة في الملف.</p>
        <input type="file" id="backupFile" accept=".json">
        <div class="form-actions"><button class="btn btn-outline" id="backupImportBtn">استرجاع من الملف</button></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title" style="color:var(--danger)">منطقة الخطر</div>
      <p class="section-desc">حذف جميع بيانات النظام نهائياً (لا يمكن التراجع).</p>
      <button class="btn btn-danger" id="wipeBtn">مسح جميع البيانات</button>
    </div>
  `;
  document.getElementById('backupExportBtn').addEventListener('click', ()=>{
    const backup = { definitions: DEFS, movements: MOV, settings: SETTINGS, exportedAt: new Date().toISOString() };
    downloadFile('نسخة_احتياطية_'+todayStr()+'.json', JSON.stringify(backup, null, 2), 'application/json');
  });
  document.getElementById('backupImportBtn').addEventListener('click', async ()=>{
    const file = document.getElementById('backupFile').files[0];
    if(!file){ toast('اختر ملف نسخة احتياطية أولاً'); return; }
    if(!confirm('سيتم استبدال جميع البيانات الحالية. هل تريد المتابعة؟')) return;
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      if(backup.definitions) DEFS = backup.definitions;
      if(backup.movements) MOV = backup.movements;
      if(backup.settings) SETTINGS = backup.settings;
      await saveDefs(); await saveMov(); await saveSettings();
      toast('تم استرجاع النسخة الاحتياطية بنجاح');
      renderApp();
    }catch(e){ toast('ملف غير صالح'); }
  });
  document.getElementById('wipeBtn').addEventListener('click', async ()=>{
    if(!confirm('هل أنت متأكد من مسح جميع البيانات؟ هذا الإجراء لا يمكن التراجع عنه.')) return;
    if(!confirm('تأكيد نهائي: سيتم فقد جميع البيانات نهائياً.')) return;
    DEFS = { vehicles: [], drivers: [], lines: [], expenseTypes: [] };
    MOV = { dailyLogs: [], expenses: [] };
    SETTINGS = { oilChangeThreshold: 5000, licenseAlertDays: 30 };
    await saveDefs(); await saveMov(); await saveSettings();
    toast('تم مسح جميع البيانات');
    renderApp();
  });
}

/* ---------------- Init ---------------- */
(async function init(){
  await loadState();
  if(!DEFS.users || DEFS.users.length===0){
    const adminHash = await hashPassword('admin123');
    DEFS.users = [{ id: uid(), username:'admin', passwordHash: adminHash, isAdmin:true, permissions: ALL_VIEW_IDS, active:true }];
    await saveDefs();
  }
  renderApp();
})();
</script>
